<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Panificadora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo h1 {
            font-size: 28px;
            color: #2C3E50;
            margin-bottom: 4px;
        }

        .login-logo p {
            color: #888;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            margin-top: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-login:hover { opacity: 0.9; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg {
            margin-top: 14px;
            padding: 10px 14px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">
        <h1>🥐 Panificadora</h1>
        <p>Panel de Administración</p>
    </div>

    <form onsubmit="iniciarSesion(event)">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="admin" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

        <button type="submit" class="btn-login" id="btn-submit">Iniciar Sesión</button>
    </form>

    <div class="error-msg" id="error-msg"></div>
</div>

<script>
async function iniciarSesion(e) {
    e.preventDefault();
    const btn    = document.getElementById('btn-submit');
    const errDiv = document.getElementById('error-msg');
    errDiv.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                usuario:  document.getElementById('usuario').value.trim(),
                password: document.getElementById('password').value,
            }),
        });

        if (!res.ok) {
            const err = await res.json();
            errDiv.textContent  = err.detail || 'Credenciales inválidas';
            errDiv.style.display = 'block';
            return;
        }

        const { token } = await res.json();
        localStorage.setItem('dashboard_token', token);
        window.location.href = '/dashboard';
    } catch {
        errDiv.textContent  = 'Error de conexión. Intenta de nuevo.';
        errDiv.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
    }
}
</script>
</body>
</html>
